# Build the macOS packages (Apple Silicon and Intel): ScummVM with the
# Ultima engine from the localization branch of the engine fork, the
# translation and the fonts. Run by hand (Actions > macOS > Run workflow)
# or for a version tag; the packages are the run's artifacts.
name: macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in the package name
        default: dev
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  ENGINE_REPO: pmanyeh/scummvm
  ENGINE_REF: ultima8-zh-tw-dev

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            minos: '11.0'
          - runner: macos-15-intel
            arch: x86_64
            minos: '13.0'
    runs-on: ${{ matrix.runner }}
    env:
      # the oldest macOS the package runs on
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.minos }}
      DEPS: ${{ github.workspace }}/macos-deps
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Checkout the engine
        uses: actions/checkout@v5
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          path: scummvm-src
      - name: Install packages
        run: brew install cmake pkgconf
      # SDL2 and FreeType built for MACOSX_DEPLOYMENT_TARGET; Homebrew's
      # libraries only run on the runner's macOS or newer
      - name: Build libraries
        run: tools/build/build_macos_deps.sh "$DEPS"
      # only the libraries built above; the rest isn't needed by Ultima 8
      - name: Configure
        working-directory: scummvm-src
        run: >
          PATH="$DEPS/bin:/usr/bin:/bin:/usr/sbin:/sbin" PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig"
          ./configure --disable-all-engines --enable-engine=ultima,ultima8 --enable-release
          --with-sdl-prefix="$DEPS"
          --disable-ogg --disable-vorbis --disable-tremor --disable-mad --disable-fribidi --disable-flac
          --disable-jpeg --disable-png --disable-gif --disable-theoradec --disable-vpx --disable-faad
          --disable-fluidsynth --disable-fluidlite --disable-sonivox --disable-sparkle --disable-readline
          --disable-sdlnet --disable-libcurl --disable-enet --disable-discord --disable-cloud
      - name: Build
        working-directory: scummvm-src
        run: make -j"$(sysctl -n hw.ncpu)"
      - name: Package
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          tools/package/make_macos_bundle.sh "$VERSION" "${{ matrix.arch }}" "$DEPS"
      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: Ultima8-zhTW-macOS-${{ matrix.arch }}
          path: dist/*.zip
