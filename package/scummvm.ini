# =====================================================================
# Ultima VIII 繁體中文版的設定。完整說明與調整範例見 SETTINGS.zh-TW.md。
#
# - 請在 ScummVM 關閉時修改，存成 UTF-8。
# - 以 # 開頭的行是註解。ScummVM 會保留註解，但會重新排列設定的順序，
#   所以每個設定的註解都寫明它屬於哪一類。
# - [scummvm] 區段的設定對所有遊戲有效；只想改 Ultima VIII，可以寫在
#   [ultima8] 區段（新增遊戲後才會出現），兩邊都有時以 [ultima8] 為準。
#
# 以下是預設沒有寫出、需要時可以加到 [scummvm] 區段的設定：
#   font_cjk_hd_size=12           【高解析】字級（預設同 font_cjk_size）
#   font_cjk_hd_border=0.5        【高解析】文字黑框粗細，0 為無黑框
#   font_cjk_hd_antialiasing=true 【高解析】反鋸齒
#   hd_text_size=1920x1440        【高解析】高解析畫面大小（預設配合視窗）
#   bark_lines=4                  【台詞框】每頁行數（預設：高解析開啟時 4 行，
#                                 未開時維持原版高度）
#
# 書本、捲軸、片頭字幕、墓碑、牌匾可以各自設定字型（book、scroll、intro、
# grave、plaque），例如墓碑：
#   font_cjk_grave_file=WangHanZongWeiBeiTiFan-2.ttf  字型檔（extra 資料夾）
#   font_cjk_grave_size=32          字級（遊戲像素）
#   font_cjk_grave_color=404040     文字顏色（RRGGBB）
#   font_cjk_grave_shadow_color=AEAEAE  雕刻陰影的顏色（none 為不要陰影）
#   font_cjk_grave_shadow_x=1       陰影偏移（遊戲像素，可為負數）
#   font_cjk_grave_shadow_y=1
#   另有 _antialiasing、_letter_spacing、_latin_spacing、_line_spacing、_border。
#   沒設定的項目沿用對話的設定；墓碑、牌匾預設為魏碑體 32 像素的雕刻效果。
# =====================================================================
[scummvm]
# 中文化資料（翻譯檔、字型）所在的資料夾
extrapath=extra
# 【一般字型】未開高解析中文字時用的字型檔（extra 資料夾）。Cubic 11 是點陣字型
font_cjk_file=Cubic_11.ttf
# 【一般字型】字級（遊戲像素）
font_cjk_size=12
# 【一般字型】反鋸齒：點陣字型請關閉（false），一般向量字型建議開啟（true）
font_cjk_antialiasing=false
# 【一般字型】字與字之間多加的間距（遊戲像素）
font_cjk_letter_spacing=1
# 【一般字型】中文與英文字母、數字相接處再多加的間距（遊戲像素）
font_cjk_latin_spacing=3
# 【一般字型】行與行之間多加的間距（遊戲像素）
font_cjk_line_spacing=0
# 【高解析】高解析中文字用的字型檔（extra 資料夾），建議用向量字型
font_cjk_hd_file=jf-openhuninn-2.1.ttf
# 【高解析】字與字之間多加的間距（遊戲像素，可有小數）
font_cjk_hd_letter_spacing=0.3
# 【高解析】中文與英文字母、數字相接處再多加的間距（遊戲像素，可有小數）
font_cjk_hd_latin_spacing=1
# 【高解析】行與行之間多加的間距（遊戲像素，可有小數）
font_cjk_hd_line_spacing=0
# 【台詞框】寬度（遊戲像素；畫面寬 320，最大 300）。寬一點換行就少一點
bark_width=194
# 【快捷圖示列】true：滑鼠移到右下角才出現；false：一直顯示
quick_bar_autohide=true
