[scummvm]
# ---------------------------------------------------------------------
# Ultima VIII 繁體中文版的設定。完整說明見 SETTINGS.zh-TW.md。
# 請在 ScummVM 關閉時修改。以 # 開頭的行是註解；拿掉行首的 # 就會生效。
# 這裡的設定對所有遊戲有效；只想改 Ultima VIII，可以寫在 [ultima8] 區段。
# ---------------------------------------------------------------------
# 中文化資料（翻譯檔、字型）所在的資料夾
extrapath=extra
# ===== 中文字型（遊戲原本的解析度 320x200，單位：像素） =====
# 字型檔（放在 extra 資料夾）。Cubic 11 是點陣字型，風格貼近原作
font_cjk_file=Cubic_11.ttf
# 字級
font_cjk_size=12
# 反鋸齒：點陣字型請關閉（false），一般向量字型建議開啟（true）
font_cjk_antialiasing=false
# 字與字之間多加的間距
font_cjk_letter_spacing=1
# 中文與英文字母、數字相接處再多加的間距
font_cjk_latin_spacing=3
# 行與行之間多加的間距
font_cjk_line_spacing=0
# ===== 高解析中文字（遊戲選項「High-resolution Chinese text」開啟時） =====
# 中文以視窗的解析度繪製。以下數值的單位是「遊戲像素」，可以有小數，與視窗大小無關。
# 字型檔（放在 extra 資料夾），建議用向量字型
font_cjk_hd_file=jf-openhuninn-2.1.ttf
# 字級（不寫則與 font_cjk_size 相同）
#font_cjk_hd_size=12
# 字與字之間多加的間距
font_cjk_hd_letter_spacing=0.3
# 中文與英文字母、數字相接處再多加的間距
font_cjk_hd_latin_spacing=1
# 行與行之間多加的間距
font_cjk_hd_line_spacing=0
# 黑框粗細（不寫則為原本黑框的一半）
#font_cjk_hd_border=0.5
# 反鋸齒（預設開啟）
#font_cjk_hd_antialiasing=true
# 高解析畫面的大小（不寫則配合視窗大小）
#hd_text_size=1920x1440
# ===== 台詞框（只影響中文台詞，英文維持原版） =====
# 每頁行數（不寫則：高解析開啟時 4 行，未開時維持原版高度）。
# 框的高度依字型自動計算，最高約半個畫面
#bark_lines=4
# 寬度（遊戲像素；畫面寬 320，最大 300）。寬一點換行就少一點
bark_width=194
# ===== 快捷圖示列（遊戲選項「Quick action icons」開啟時） =====
# true：滑鼠移到右下角才出現；false：一直顯示
quick_bar_autohide=true
